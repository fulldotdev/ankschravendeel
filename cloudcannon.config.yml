source: /

paths:
  static: public
  uploads: public/images

collections_config:
  pages:
    name: Pagina's
    url: /[full_slug]/
    path: src/content/pages
    icon: web
    disable_file_actions: true
    disable_add_folder: true
  services:
    name: Aanbod
    url: /aanbod/[full_slug]/
    path: src/content/services
    icon: design_services
    disable_file_actions: true
    disable_add_folder: true
  articles:
    name: Artikelen
    url: /blog/[full_slug]/
    path: src/content/articles
    icon: news
    disable_file_actions: true
    disable_add_folder: true
  events:
    name: Agenda
    url: /agenda/[full_slug]/
    path: src/content/events
    icon: calendar_month
    disable_file_actions: true
    disable_add_folder: true
  posts:
    name: Lezingen
    url: /lezingen/[full_slug]/
    path: src/content/posts
    icon: post
    disable_file_actions: true
    disable_add_folder: true
  podcasts:
    name: Podcasts
    url: /podcasts/[full_slug]/
    path: src/content/podcasts
    icon: podcasts
    disable_file_actions: true
    disable_add_folder: true
  persons:
    name: Personen
    url: /personen/[full_slug]/
    path: src/content/persons
    icon: person
    disable_file_actions: true
    disable_add_folder: true
  policies:
    name: Beleid
    url: /beleid/[full_slug]/
    path: src/content/policies
    icon: policy
    disable_file_actions: true
    disable_add_folder: true
  reviews:
    name: Reviews
    url: /reviews/[full_slug]/
    path: src/content/reviews
    icon: star
    disable_file_actions: true
    disable_add_folder: true
  data:
    name: Data
    path: src/data
    icon: data_object
    disable_file_actions: true
    disable_add_folder: true
    disable_add: true

collection_groups:
  - heading: Content
    collections:
      - pages
      - services
      - events
      - posts
      - podcasts
      - articles
  - heading: Settings
    collections:
      - data

_enabled_editors:
  - visual
  - content
  - data

_inputs:
  block:
    hidden: true
  draft:
    label: Verberg op website
    comment: Zet dit aan voor oude, incomplete of dubbele content.
    type: switch
  title:
    label: Titel
  description:
    label: Korte omschrijving
    type: textarea
    comment: Houd dit kort; deze tekst verschijnt vaak op kaarten en overzichtspagina's.
  published:
    label: Publicatiedatum of startdatum
    type: date
  when:
    label: Wanneer
    type: text
  where:
    label: Waar
    type: text
  tags:
    label: Categorieen
  src:
    type: image
    options:
      accepts_mime_types: "image/jpeg,image/jpg,image/png,image/webp"
      mime_type: image/webp
      resize_style: contain
      width: 1920
      height: 1920
  href:
    type: url
  rating:
    type: range
    options:
      min: 0
      max: 5
      step: 0.5
  paragraph:
    type: textarea
  content:
    type: html
